spring:
  application:
    name: sareekart-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sareekart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
      file-size-threshold: 2KB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:SareeKartSecretKeyForJWTTokenGenerationAndValidationMustBeAtLeast256BitsLong}
    expiration: ${JWT_EXPIRATION:86400000}
  upload:
    dir: ${UPLOAD_DIR:./uploads/products}
  storage:
    provider: ${APP_STORAGE_PROVIDER:local}
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_S3_ENDPOINT:}
    upload-dir: ${UPLOAD_DIR:./uploads/products}
    max-file-size: ${APP_MAX_FILE_SIZE:5242880}
    cdn-base-url: ${AWS_CDN_BASE_URL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  refund-reconciliation:
    enabled: ${APP_REFUND_RECONCILIATION_ENABLED:true}
    stale-minutes: ${APP_REFUND_RECONCILIATION_STALE_MINUTES:15}
    batch-size: ${APP_REFUND_RECONCILIATION_BATCH_SIZE:50}
    interval-ms: ${APP_REFUND_RECONCILIATION_INTERVAL_MS:120000}
    initial-delay-ms: ${APP_REFUND_RECONCILIATION_INITIAL_DELAY_MS:30000}
    max-attempts: ${APP_REFUND_RECON_MAX_ATTEMPTS:10}
    backoff-base-seconds: ${APP_REFUND_RECON_BACKOFF_BASE_SECONDS:60}
    backoff-max-seconds: ${APP_REFUND_RECON_BACKOFF_MAX_SECONDS:3600}
  sweeper:
    enabled: ${APP_SWEEPER_ENABLED:true}
    stale-after-minutes: ${APP_SWEEPER_STALE_MINUTES:30}
    batch-size: ${APP_SWEEPER_BATCH_SIZE:100}
    interval-ms: ${APP_SWEEPER_INTERVAL_MS:60000}
    initial-delay-ms: ${APP_SWEEPER_INITIAL_DELAY_MS:20000}
  razorpay:
    # Disabled by default: dev/test boots stay green without gateway keys.
    # Docker compose / production set APP_RAZORPAY_ENABLED=true explicitly.
    enabled: ${APP_RAZORPAY_ENABLED:false}
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}

logging:
  level:
    com.sareekart: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true