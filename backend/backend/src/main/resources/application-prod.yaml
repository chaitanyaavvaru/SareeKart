spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      pool-name: SareeKartProdHikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:8}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 32
    clean-disabled: true
    validate-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8081}
  shutdown: graceful
  tomcat:
    threads:
      max: 25
      min-spare: 5

logging:
  level:
    root: WARN
    com.sareekart: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

app:
  auth:
    expose-reset-token-in-response: ${EXPOSE_RESET_TOKEN_IN_RESPONSE:false}
