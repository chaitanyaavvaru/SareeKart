spring:
  datasource:
    url: jdbc:h2:mem:sareekart_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

logging:
  level:
    com.sareekart: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

management:
  health:
    neo4j:
      enabled: false

# Test-only WhatsApp configuration — NOT production secrets
whatsapp:
  webhook:
    app-secret: test-whatsapp-hmac-secret-for-unit-tests

app:
  canonical-domain: https://sareekart.com
