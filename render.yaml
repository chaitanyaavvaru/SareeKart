# SareeKart Zero-Cost Cloud Deployment Blueprint (Render Web Service Free Tier)
# Milestone 2: Spring Boot 3 Backend under 512 MB RAM Constraint
# Deployment Specification: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sareekart-backend
    env: docker
    dockerfilePath: ./backend/backend/Dockerfile
    dockerContext: ./backend/backend
    plan: free
    region: singapore # Low-latency regional proximity to TiDB Cloud ap-southeast-1
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx384m -Xms128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      - key: SPRING_DATASOURCE_URL
        sync: false # Injected via Render Dashboard: jdbc:mysql://<tidb_host>:4000/<tidb_db>?useSSL=true&allowPublicKeyRetrieval=true
      - key: SPRING_DATASOURCE_USERNAME
        sync: false # Injected via Render Dashboard
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false # Injected via Render Dashboard
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: SPRING_FLYWAY_ENABLED
        value: "true"
      - key: SPRING_FLYWAY_BASELINE_ON_MIGRATE
        value: "false"
      - key: NEO4J_ENABLED
        value: "false"
      - key: JWT_SECRET
        sync: false # Injected via Render Dashboard (64-character secret)
      - key: CORS_ALLOWED_ORIGINS
        value: "https://sareekart.com,https://*.vercel.app"
      - key: HIKARI_MAX_POOL_SIZE
        value: "8"
      - key: HIKARI_MIN_IDLE
        value: "2"
      - key: LOG_LEVEL_SAREEKART
        value: INFO
