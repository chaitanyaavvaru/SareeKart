name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Run Node.js tests
        run: node --test tests/*.test.mjs

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || 'ci_disposable_sareekart_2026' }}
          MYSQL_DATABASE: sareekart_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    defaults:
      run:
        working-directory: backend/backend
    env:
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || 'ci_disposable_sareekart_2026' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Wait for MySQL readiness
        run: |
          echo "Waiting for MySQL service to become ready on 127.0.0.1:3306..."
          READY=false
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -p"${SPRING_DATASOURCE_PASSWORD}" --silent; then
              echo "MySQL is ready and accepting connections."
              READY=true
              break
            fi
            echo "MySQL not ready yet. Retrying in 2 seconds ($i/30)..."
            sleep 2
          done

          if [ "$READY" != "true" ]; then
            echo "Error: MySQL did not become ready within 60 seconds."
            exit 1
          fi

          mysql -h 127.0.0.1 -P 3306 -u root -p"${SPRING_DATASOURCE_PASSWORD}" -e "SELECT VERSION();"

      - name: Seed test database from canonical backup
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -p"${SPRING_DATASOURCE_PASSWORD}" sareekart_db < "$GITHUB_WORKSPACE/backups/sareekart_db_latest.sql"

      - name: Verify seeded schema
        run: |
          TABLE_COUNT=$(mysql -h 127.0.0.1 -P 3306 -u root -p"${SPRING_DATASOURCE_PASSWORD}" sareekart_db -e "SHOW TABLES;" -s -N | wc -l | tr -d ' ')
          echo "Restored $TABLE_COUNT tables in sareekart_db"
          if [ "$TABLE_COUNT" -ne 37 ]; then
            echo "Expected 37 tables, found $TABLE_COUNT"
            exit 1
          fi

      - name: Run backend test suite
        run: ./mvnw test -Ddb.password="${SPRING_DATASOURCE_PASSWORD}"

  docker-ci:
    name: Docker Builds & Hardening CI
    runs-on: ubuntu-24.04
    needs: [frontend-ci, backend-ci]
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build frontend container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: sareekart-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify frontend container non-root & healthcheck
        run: |
          echo "=== Verify Frontend User ==="
          FRONTEND_USER=$(docker run --rm --entrypoint whoami sareekart-frontend:ci)
          echo "Frontend user: $FRONTEND_USER"
          if [ "$FRONTEND_USER" != "nginx" ]; then
            echo "Security violation: Frontend container must run as non-root user 'nginx', got '$FRONTEND_USER'"
            exit 1
          fi

          echo "=== Verify Frontend UID ==="
          FRONTEND_UID=$(docker run --rm --entrypoint id sareekart-frontend:ci -u)
          echo "Frontend UID: $FRONTEND_UID"
          if [ "$FRONTEND_UID" -eq 0 ]; then
            echo "Security violation: Frontend container UID is 0 (root)"
            exit 1
          fi

          echo "=== Test Frontend Runtime & Health Endpoint ==="
          docker run -d --name test-frontend --add-host backend:127.0.0.1 -p 8080:8080 sareekart-frontend:ci
          sleep 5
          curl -f http://127.0.0.1:8080/health.html
          curl -f http://127.0.0.1:8080/ | head -5
          docker rm -f test-frontend

      - name: Build backend container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend/backend
          file: ./backend/backend/Dockerfile
          load: true
          tags: sareekart-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify backend container non-root & healthcheck
        run: |
          echo "=== Verify Backend User ==="
          BACKEND_USER=$(docker run --rm --entrypoint whoami sareekart-backend:ci)
          echo "Backend user: $BACKEND_USER"
          if [ "$BACKEND_USER" != "appuser" ]; then
            echo "Security violation: Backend container must run as non-root user 'appuser', got '$BACKEND_USER'"
            exit 1
          fi

          echo "=== Verify Backend UID ==="
          BACKEND_UID=$(docker run --rm --entrypoint id sareekart-backend:ci -u)
          echo "Backend UID: $BACKEND_UID"
          if [ "$BACKEND_UID" -eq 0 ]; then
            echo "Security violation: Backend container UID is 0 (root)"
            exit 1
          fi

          echo "=== Verify Backend Healthcheck Configuration ==="
          docker inspect sareekart-backend:ci --format '{{json .Config.Healthcheck}}' | grep -i "actuator/health"

  terraform-ci:
    name: Terraform Validation CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform CLI
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.7.5'

      - name: Verify Terraform formatting
        run: terraform fmt -check -recursive terraform/

      - name: Initialize Dev Environment (Backend Disabled)
        working-directory: terraform/environments/dev
        run: terraform init -backend=false

      - name: Validate Dev Environment Configuration
        working-directory: terraform/environments/dev
        run: terraform validate

  terraform-security-ci:
    name: Terraform Security & Lint CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up TFLint CLI
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: Show TFLint version
        run: tflint --version

      - name: Initialize TFLint AWS Ruleset Plugin
        run: tflint --chdir=terraform --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint Code & Best-Practice Linting
        run: tflint --chdir=terraform --recursive --force

      - name: Run Trivy Security & Misconfiguration Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'terraform'
          version: 'v0.75.0'
          format: 'table'
          exit-code: '0' # Report-only baseline for Step 4.4 audit phase
          hide-progress: true

  terraform-test-ci:
    name: Terraform Native Test CI (Mock Provider)
    runs-on: ubuntu-24.04
    needs: [terraform-ci]
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform CLI
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.7.5'

      - name: Initialize Dev Environment (Backend Disabled)
        working-directory: terraform/environments/dev
        run: terraform init -backend=false

      - name: Run Native Terraform Tests (mock_provider)
        working-directory: terraform/environments/dev
        run: terraform test -no-color
