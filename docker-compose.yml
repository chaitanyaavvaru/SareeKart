version: '3.8'

# ============================================================================
# SareeKart — Development Docker Compose
#
# Usage:
#   cp .env.example .env        # fill in local values
#   docker compose up -d
#
# Secrets are read from a .env file (gitignored). Never hardcode passwords here.
# Database ports are bound to 127.0.0.1 so they are not accessible from the
# network or from other containers outside this Compose project.
# ============================================================================

services:
  db:
    image: mysql:8.0
    container_name: sareekart-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: sareekart_db
    # Bind to loopback only — prevents exposure to LAN or other Docker networks.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile
    container_name: sareekart-backend
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/sareekart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sareekart-frontend
    restart: always
    # Port 8080 because frontend now runs as non-root nginx on unprivileged port.
    # Access the app at http://localhost:8080 (or map 80:8080 if preferred).
    ports:
      - "8080:8080"
    depends_on:
      - backend

  neo4j:
    image: neo4j:5.26-community
    container_name: sareekart-neo4j
    restart: always
    # Bind to loopback only — admin browser UI and Bolt not accessible from LAN.
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
    volumes:
      - neo4j_data:/data

volumes:
  mysql_data:
  neo4j_data:
